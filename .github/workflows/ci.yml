name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc --noEmit, then vite build (which also writes dist/sw.js)
      - run: npm run build
      - run: npm run check-offline
      # the spell parser: thesaurus integrity and example phrases
      - run: npm run check-spells
      # the checks drive the system Chrome that ubuntu-latest already has
      - run: npm run check-pwa
        env:
          CHROME: /usr/bin/google-chrome
      - run: npm run check-tasks
        env:
          CHROME: /usr/bin/google-chrome
